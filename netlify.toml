[build]
  command   = "npm run build"
  publish   = ".next"

[build.environment]
  NODE_VERSION          = "20"
  NEXT_PUBLIC_SITE_URL  = "https://jazzharris.com"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The résumé PDF carries a personal phone number and email. Keep it reachable
# to anyone given the link, but out of search indexes and AI/scraper corpora.
[[headers]]
  for = "/Jazz-Harris-Resume.pdf"
  [headers.values]
    X-Robots-Tag = "noindex, noarchive, nosnippet, noimageindex"
